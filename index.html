document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:40%;right:-160px;opacity:.16;animation:drift2 44s ease-in-out infinite}\n  .ambient .b3{width:420px;height:420px;background:var(--cream);bottom:-100px;left:30%;opacity:.45;animation:drift3 50s ease-in-out infinite}\n  .ambient .b4{width:380px;height:380px;background:var(--teal);top:65%;left:-80px;opacity:.10;animation:drift1 56s ease-in-out infinite reverse}\n  .ambient .b5{width:340px;height:340px;background:var(--peach-soft);top:15%;left:55%;opacity:.18;animation:drift2 42s ease-in-out infinite reverse}\n\n  @keyframes drift1{0%,100%{transform:translate(0,0)}33%{transform:translate(40px,28px)}66%{transform:translate(-30px,50px)}}\n  @keyframes drift2{0%,100%{transform:translate(0,0)}33%{transform:translate(-44px,30px)}66%{transform:translate(36px,-22px)}}\n  @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(36px,-40px)}}\n\n  /* ========== NAV ========== */\n  .nav{\n    position:sticky;top:0;z-index:50;\n    background:rgba(238,245,244,.78);\n    backdrop-filter:saturate(160%) blur(14px);\n    -webkit-backdrop-filter:saturate(160%) blur(14px);\n    border-bottom:1px solid transparent;\n    transition:border-color .25s ease, background .25s ease;\n  }\n  .nav.is-scrolled{border-bottom-color:var(--border);background:rgba(238,245,244,.92)}\n  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px}\n  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--teal);letter-spacing:-.01em}\n  .brand-mark{\n    width:32px;height:32px;border-radius:9999px;background:var(--teal);\n    display:grid;place-items:center;color:#fff;\n    box-shadow:0 0 0 6px rgba(44,122,123,.12);\n  }\n  .nav-links{display:none;align-items:center;gap:28px}\n  .nav-links a{color:var(--text-2);font-weight:500;font-size:15px;transition:color .15s}\n  .nav-links a:hover{color:var(--text)}\n  @media(min-width:900px){.nav-links{display:flex}}\n  .nav-cta{display:none}\n  @media(min-width:900px){.nav-cta{display:i idth:3px;height:200px;background:var(--border);border-radius:9999px;overflow:hidden;\n    display:none;\n  }\n  @media(min-width:900px){.hiw-progress{display:block}}\n  .hiw-progress .fill{position:absolute;top:0;left:0;width:100%;background:var(--teal);height:0;transition:height .25s ease}\n\n  /* ===== BEFORE/AFTER — pinned morph ===== */\n  .ba-pin{position:relative}\n  .ba-stage{\n    position:relative;display:grid;place-items:center;\n    min-height:520px;perspective:1200px;\n  }\n  .ba-card{\n    background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px 26px;\n    width:100%;max-width:520px;\n    display:flex;flex-direction:column;gap:14px;\n    position:absolute;will-change:transform,opacity;\n  }\n  .ba-card.before{\n    background:#fbf6ed;border-color:#e7ce97;\n    transform:rotate(-6deg);\n  }\n  .ba-card.after{\n    background:linear-gradient(180deg,#fff,#f6fbfb);\n    box-shadow:var(--shadow-card-lg);\n    transform:rotate(6deg);\n    opacity:0;\n  }\n  .ba-card .ba-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}\n  .ba-card.before .ba-eyebrow{color:#b46219}\n  .ba-card.after .ba-eyebrow{color:var(--teal)}\n  .ba-card h3{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.2}\n  .ba-card p{font-size:15px;color:var(--text-2);margin:0}\n\n  /* ===== STAY SERENO letter split ===== */\n  .typo-moment h2 .ch{display:inline-block;will-change:transform,opacity}\n\n  /* ===== PRICING toggle Y-slide upgrade ===== */\n  .price-amount{display:flex;align-items:baseline;gap:6px;margin:0 0 4px;min-height:52px;overflow:visible;position:relative}\n  .price-amount .stack-roll{\n    display:flex;align-items:baseline;gap:6px;will-change:transform,opacity;\n  }\n  .save-pill{transform-origin:center;will-change:transform}\n\n  /* ===== FAQ — inner text fade ===== */\n  .faq-a-inner{transition:opacity .25s ease}\n  .faq-item:not(.open) .faq-a-inner{opacity:0}\n\n  /* ===== Magnetic CTA helper == e, box-shadow .25s ease;\n    position:relative;overflow:hidden;\n  }\n  .life-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-card-lg)}\n  .life-ic{\n    width:56px;height:56px;border-radius:14px;display:grid;place-items:center;\n    margin-bottom:14px;color:var(--accent,var(--teal));\n    background:color-mix(in oklab, var(--accent,var(--teal)) 12%, transparent);\n  }\n  .life-card h3{font-size:17px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}\n  .life-card p{font-size:14px;color:var(--text-2);line-height:1.55;margin:0}\n\n  /* ===== STATS ===== */\n  .stats{padding:60px 0;position:relative;z-index:1}\n  .stat-grid{\n    display:grid;gap:24px;grid-template-columns:repeat(2,1fr);\n    background:#fff;border-radius:24px;padding:32px 28px;\n    box-shadow:var(--shadow-card);\n  }\n  @media(min-width:760px){.stat-grid{grid-template-columns:repeat(4,1fr);padding:40px 32px;gap:32px}}\n  .stat-cell{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}\n  .sn{font-size:clamp(48px,5.2vw,64px);font-weight:800;letter-spacing:-.03em;color:var(--teal);line-height:1;font-variant-numeric:tabular-nums}\n  .sk{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2)}\n\n  /* ===== HIW Screen 1 — Summary card ===== */\n  .sum-card{\n    background:linear-gradient(180deg, rgba(44,122,123,.10), rgba(44,122,123,.05));\n    border:1px solid rgba(44,122,123,.18);\n    border-radius:14px;padding:10px 12px;margin-bottom:10px;\n  }\n  .sum-row{display:flex;gap:6px;justify-content:space-between}\n  .sum-stat{flex:1;text-align:center}\n  .sum-stat .sv{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--text);line-height:1.1}\n  .sum-stat .sv small{font-size:11px;font-weight:600;color:var(--text-2);margin-left:1px}\n  .sum-stat .sv.up{color:var(--success)}\n  .sum-stat .sl{font-size:9px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}\n\n  /* ===== HIW Screen 2 — Stat cards ===== */\n  .stat-card{\n    border-radius:12px;padding:11px 13px;margin-bottom:8px;border:1px solid transparent;\n  }\n  .stat-card.tint-teal{background:rgba(44,122,123,.10);border-color:rgba(44,122,123,.20)}\n  .stat-card.tint-peach{background:rgba(244,162,97,.14);border-color:rgba(244,162,97,.26)}\n  .stat-card.tint-verde{background:rgba(6,167,125,.12);border-color:rgba(6,167,125,.22)}\n  .stat-card .sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}\n  .stat-card .sc-eyebrow{font-size:10px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}\n  .stat-card .sc-pill{font-size:9px;font-weight:700;color:var(--success);background:rgba(6,167,125,.18);padding:2px 7px;border-radius:9999px;white-space:nowrap}\n  .stat-card .sc-pill.peach{color:#a14a00;background:rgba(244,162,97,.28)}\n  .stat-card .sc-pill.verde{color:#066d52;background:rgba(6,167,125,.22)}\n  .stat-card .sc-val{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.01em}\n  .stat-card .sc-val strong{font-size:16px;font-weight:800}\n  .stat-card .sc-pct{font-weight:600;color:var(--text-2);font-size:11px}\n  .stat-card .sc-sub{font-size:10px;color:var(--text-3);margin-top:2px}\n\n  .rep-share.teal-outline{\n    background:transparent;color:var(--teal);border:1.5px solid var(--teal);margin-top:8px;\n  }\n\n  /* ===== HIW Screen 3 — Family with photos ===== */\n  .fam-roster{\n    display:flex;gap:8px;background:#fff;border-radius:14px;padding:10px;\n    margin-bottom:10px;justify-content:space-around;\n  }\n  .fam-mem{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}\n  .fam-photo{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--teal-light);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.10)}\n  .fam-photo img{width:100%;height:100%;object-fit:cover}\n  .fam-photo.init{display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:-.01em;line-height:1}\n  .fam-name{font-size:10px;font-weight:700;color:var(--text);line-height:1}\n  .fam-role{font-size:8px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}\n\n  .fam-feed{display:flex;flex-direction:column;gap:6px}\n  .fam-act{\n    background:#fff;border-radius:12px;padding:9px 11px;\n    display:flex;align-items:center;gap:9px;box-shadow:0 1px 0 var(--border);position:relative;\n  }\n  .fam-act .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}\n  .fam-act .dot.teal{background:var(--teal)}\n  .fam-act .dot.peach{background:var(--peach)}\n  .fa-meta{flex:1;min-width:0}\n  .fa-txt{font-size:10.5px;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .fa-txt strong{font-weight:700}\n  .fa-sub{font-size:9px;color:var(--text-2);margin-top:1px}\n  .fa-time{font-size:9px;color:var(--text-3);flex-shrink:0;font-weight:600}\n\n  /* ===== LANGUAGE SWITCHER ===== */\n  .lang{position:relative;display:none}\n  @media(min-width:900px){.lang{display:inline-block;margin-left:14px}}\n  .lang-btn{\n    display:inline-flex;align-items:center;gap:6px;\n    padding:8px 12px;border-radius:9999px;\n    background:#fff;border:1px solid var(--border);\n    font-size:13px;font-weight:600;color:var(--text);\n    transition:border-color .2s, box-shadow .2s;\n  }\n  .lang-btn:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(44,122,123,.10)}\n  .lang-btn .flag-svg{width:18px;height:13px;border-radius:2px;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.08)}\n  .lang-btn .code{letter-spacing:.06em}\n  .lang-btn .caret{width:10px;height:10px;color:var(--text-2);transition:transform .2s}\n  .lang.open .lang-btn .caret{transform:rotate(180deg)}\n  .lang-menu{\n    position:absolute;top:calc(100% + 6px);right:0;\n    background:#fff;border:1px solid var(--border);border-radius:14px;\n    box-shadow:var(--shadow-card-lg);\n    padding:6px;min-width:170px;\n    opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;\n    transition:opacity .2s ease, transform .2s ease;z-index:55;\n  }\n  .lang.open .lang-menu{opacity:1;transform:none;pointer-events:auto}\n  .lang-item{\n    display:flex;align-items:center;gap:10px;width:100%;\n    padding:9px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text);text-align:left;\n    transition:background .15s ease;\n  }\n  .lang-item:hover{background:var(--teal-light)}\n  .lang-item.active{color:var(--teal)}\n  .lang-item .flag-svg{width:20px;height:14px;flex-shrink:0;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08)}\n\n  /* ===== CUSTOM CURSOR ===== */\n  .cursor-orb{\n    position:fixed;top:0;left:0;width:20px;height:20px;border-radius:50%;\n    background:rgba(44,122,123,.55);pointer-events:none;z-index:300;\n    transform:translate(-50%,-50%);\n    transition:background .18s ease, width .18s ease, height .18s ease;\n    mix-blend-mode:multiply;\n    display:none;\n  }\n  body.cursor-on .cursor-orb{display:block}\n  body.cursor-on,\n  body.cursor-on a,\n  body.cursor-on button,\n  body.cursor-on .clickable{cursor:none}\n  .cursor-orb.hover{background:rgba(244,162,97,.55);width:36px;height:36px}\n\n  /* ===== HIW step (passive labels, scroll-driven) ===== */\n  .hiw-step{user-select:none}\n\n  /* ===== Features horizontal pin (desktop) — handled by GSAP transforms ===== */\n  .features-pin-track{will-change:transform}\n\n  /* ===== i18n crossfade ===== */\n  body.i18n-swap [data-i18n]{opacity:.0;transition:opacity .15s ease}\n  body[data-lang]:not(.i18n-swap) [data-i18n]{transition:opacity .2s ease}\n\n  /* ===== PRE-INTRO LOADER (G.6.a) ===== */\n  .preloader{\n    position:fixed;inset:0;background:#eef5f4;z-index:210;\n    display:none;place-items:center;pointer-events:none;\n  }\n  html.do-intro .preloader{display:grid}\n  .preloader .pl-stage{position:relative;width:140px;height:140px;display:grid;place-items:center}\n  .preloader .pl-ring{\n    position:absolute;inset:0;\n    transform:rotate(-90deg);\n  }\n  .preloader .pl-ring circle{fill:none;stroke:var(--teal);stroke-width:2.4;stroke-linecap:round;\n    stroke-dasharray:0 999;\n  }\n  .preloader .pl-paw{color:var(--teal);opacity:0;width:64px;height:64px;will-change:transform,opacity}\n\n\n\n  /* ===== I.2.b — Touch: kill expensive animations ===== */\n  @media (pointer: coarse), (hover: none) {\n    .ambient{display:none}              /* page-wide drifting blobs */\n    .compo-layer.mesh::before,\n    .compo-layer.mesh::after,\n    .compo-layer.mesh > i{animation:none !important}\n    .typo-moment::before{animation:none !important}\n    .phone-float{animation:none !important}\n  }\n\n  /* ===== I.2.f — Typography scaling on small screens ===== */\n  @media (max-width: 768px) {\n    body{font-size:16px;line-height:1.55}\n    h1.headline{font-size:36px !important;line-height:1.1}\n    .wordmark{font-size:44px}\n    .section-title{font-size:28px !important}\n    .know-head h2{font-size:28px}\n    .typo-moment h2{font-size:48px !important}\n    .subhead{font-size:16px}\n    .section-sub{font-size:16px}\n    .final-cta h2{font-size:32px}\n    .final-cta .sub{font-size:16px}\n  }\n\n  /* ===== I.2.e — Tap targets ≥ 44px on touch ===== */\n  @media (pointer: coarse) {\n    .billing-toggle button{min-height:44px;padding:11px 18px}\n    .faq-q{min-height:60px;padding:18px 20px}\n    .kf{min-height:44px;padding:0 16px}\n    .lang-item{min-height:44px}\n    .nav-burger{min-width:44px;min-height:44px}\n    .btn{min-height:44px}\n  }\n\n  /* ===== I.2.h — Before/After mobile = side-by-side STACK (no morph) ===== */\n  @media (max-width: 899px), (pointer: coarse) {\n    .ba-pin{position:static}\n    .ba-stage{\n      min-height:auto;display:flex;flex-direction:column;gap:18px;\n      padding:0;perspective:none;\n    }\n    .ba-card{\n      position:relative !important;\n      transform:none !important;opacity:1 !important;\n      max-width:100%;width:100%;\n    }\n    .ba-card.before{order:1}\n    .ba-stage::after{\n      order:2;content:\"↓\";display:block;\n      font-size:28px;color:var(--teal);text-align:center;font-weight:700;\n      margin:-2px 0;\n    }\n    .ba-card.after{order:3}\n  }\n\n  /* ===== I.2.c — HIW mobile: unpinned vertical stack with 4 cards ===== */\n  .hiw-mobile{display:none}\n  @media (max-width: 899px), (pointer: coarse) {\n    .hiw-pin{display:none}\n    .hiw-mobile{\n      display:flex;flex-direction:column;gap:40px;padding:24px 0 40px;\n    }\n    .him-card{\n      display:flex;flex-direction:column;gap:18px;align-items:center;\n    }\n    .him-head{\n      display:flex;gap:14px;align-items:flex-start;width:100%;max-width:520px;\n      padding:0 4px;\n    }\n    .him-num{\n      flex-shrink:0;width:36px;height:36px;border-radius:50%;\n      background:var(--teal);color:#fff;display:grid;place-items:center;\n      font-weight:700;font-size:14px;\n    }\n    .him-head h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15}\n    .him-head p{margin:4px 0 0;font-size:15px;color:var(--text-2);line-height:1.5}\n    .him-phone{\n      position:relative;\n      width:266px;height:540px;border-radius:38px;background:#0f1216;padding:9px;\n      box-shadow:0 24px 60px -20px rgba(20,40,40,.40);\n    }\n    .him-phone .phone-screen{\n      width:100%;height:100%;border-radius:30px;background:var(--bg);\n      overflow:hidden;position:relative;display:flex;flex-direction:column;\n    }\n    .him-screen-body{flex:1;padding:10px 12px 12px;overflow:hidden}\n  }\n\n  /* ===== I.2.d — Language switcher in mobile sheet ===== */\n  .sheet-lang{margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}\n  .sheet-lang-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);margin-bottom:10px}\n  .sheet-lang-list{display:flex;gap:8px;flex-wrap:wrap}\n  .sheet-lang-item{\n    display:inline-flex;align-items:center am5:\"Family sharing (up to 5 members)\", b_esc:\"Missed-dose family escalation\",\n      b_sync:\"Multi-device cloud sync\",\n      b_eip:\"Everything in Plus\", b_vvr:\"Vet visit reminders\",\n      b_asa:\"Advanced symptom analytics\", b_pri:\"Priority support\",\n      b_eaf:\"Early access to new features\",\n      pri_legal:\"Auto-renews. Cancel anytime in your App Store / Play Store account. Prices in USD; local currency shown in-app.\",\n      // faq\n      faq_eyebrow:\"Questions\", faq_h:\"Frequently asked.\",\n      faq_q1:\"Does Sereno work offline?\",\n      faq_a1:\"Yes for read-only on data already synced. New entries sync when you're back online.\",\n      faq_q2:\"Can I share with my vet?\",\n      faq_a2:\"Yes — generate an Emergency Card PDF or a full Health Report PDF and share via email, WhatsApp or any app.\",\n      faq_q3:\"Can I switch plans anytime?\",\n      faq_a3:\"Yes, upgrade or downgrade anytime. Downgrades take effect at the end of the current billing period.\",\n      faq_q4:\"What happens to my data if I cancel?\",\n      faq_a4:\"Your data stays in your account. You keep read access to existing entries on Free; new entries are limited to Free caps.\",\n      faq_q5:\"Is Sereno available in other languages?\",\n      faq_a5:\"Yes — English, Italian, Spanish. The app auto-detects your device language and lets you switch manually.\",\n      faq_q6:\"Is it available on iPhone and Android?\",\n      faq_a6:\"Both. Same data, same account, real-time sync across devices.\",\n      faq_q7:\"Is my pet's data private?\",\n      faq_a7:\"Yes. Data is stored encrypted on EU servers (Supabase, Stockholm region). You can export or delete your account anytime. Sereno never sells or shares your data.\",\n      faq_q8:\"Is Sereno a replacement for veterinary care?\",\n      faq_a8:\"No. Sereno is a tracking and sharing tool. It does not diagnose, prescribe or replace professional veterinary advice.\",\n      // final cta\n      final_eyebrow:\"Ready?\", final_h:\"Start caring with confidence today.\",\n      final_sub:\"Free forever for one pet. No credit card.\",\n      // footer\n      foot_product:\"Product\", foot_legal:\"Legal\", foot_contact:\"Contact\",\n      foot_privacy:\"Privacy Policy\", foot_terms:\"Terms\",\n      foot_madein:\"Made with care in Italy.\"\n    },\n    it: {\n      nav_features:\"Funzionalità\", nav_pricing:\"Prezzi\", nav_faq:\"FAQ\", nav_cta:\"Scarica l'app\",\n      hero_eyebrow:\"Tracciatore di salute per pet con patologie croniche\",\n      hero_h:\"Prenditi cura del tuo pet, con serenità.\",\n      hero_sub:\"Mai più dati persi. Mai più dosi dimenticate. Mai più impreparato dal veterinario. Pensato per pet diabetici, epilettici e con patologie croniche — e perfetto per qualsiasi pet.\",\n      hero_trust:'Disponibile in Inglese<span class=\"sep\">·<\u002Fspan>Italiano<span class=\"sep\">·<\u002Fspan>Spagnolo<span class=\"sep\">·<\u002Fspan>iPhone &amp; Android<span class=\"sep\">·<\u002Fspan>GDPR-friendly',\n      store_appstore_small:\"Scarica su\", store_appstore_big:\"App Store\",\n      store_googleplay_small:\"Disponibile su\", store_googleplay_big:\"Google Play\",\n      know_h:\"Sappiamo cosa si prova.\", know_sub:\"Perché lo viviamo anche noi.\",\n      filter_all:\"Tutti\", filter_chronic:\"Cura cronica\", filter_everyday:\"Cura quotidiana\",\n      testi_emma_tag:\"Beagle diabetica\",\n      testi_emma_q:'\"Annotavo gli orari dell\\'insulina di Luna su un quaderno. L\\'ho perso durante una visita dal veterinario. Mai più.\"',\n      testi_marco_tag:\"Meticcio epilettico\",\n      testi_marco_q:'\"Tracciare ogni crisi voleva dire cinque app diverse e tre chat di gruppo. Ora è una sola schermata.\"',\n      testi_carmen_tag:\"Insufficienza renale\",\n      testi_carmen_q:'\"La nostra vet mi ha abbracciata quando le ho passato il PDF. Mi ha detto che nessuno le porta mai dati così chiari.\"',\n      testi_sarah_tag:\"Lab senior in salute\",\n      testi_sarah_q:'\"Bella sta benissimo a 11 anni. Voglio solo ogni vaccino, ogni visita, ogni controllo del peso in un unico posto — Sereno fa proprio questo.\"',\n      testi_james_tag:\"Sindrome di Cushing\",\n      testi_james_q:'\"Trilostano due volte al giorno, esami mensili, controllo dell\\'acqua ogni settimana. La testa scoppiava. Ora ce l\\'ho nel telefono.\"',\n      testi_yuki_tag:\"Shiba in salute\",\n      testi_yuki_q:'\"Mochi è in salute e voglio che resti così. Avvisi sui vaccini, promemoria annuali, grafico di crescita — tranquillità.\"',\n      life_eyebrow:\"Per ogni pet\",\n      life_h:\"Qualsiasi fase della vita, Sereno c'è.\",\n      life_young_h:\"Giovani & in crescita\",\n      life_young_p:\"Calendario vaccini da 6 settimane. Grafico di crescita. Microchip.\",\n      life_adult_h:\"Adulti in salute\",\n      life_adult_p:\"Visite annuali, controllo del peso, igiene dentale, prevenzione parassiti.\",\n      life_senior_h:\"Pet senior\",\n      life_senior_p:\"Andamento esami, integratori, mobilità, frequenza visite veterinarie.\",\n      life_chronic_h:\"Patologie croniche\",\n      life_chronic_p:\"Terapie quotidiane, multi-patologia, escalation in famiglia, PDF per il vet.\",\n      stat_symptoms:\"Sintomi tracciati\", stat_vaccines:\"Vaccini predefiniti\",\n      stat_languages:\"Lingue\", stat_ads:\"Pubblicità. Mai.\",\n      hiw_eyebrow:\"Come funziona\", hiw_h:\"Cura, su ogni schermata.\",\n      hiw_sub:\"Dall'insulina del mattino alla visita dal veterinario — Sereno è con te in ogni momento.\",\n      step1_t:\"Registra ogni dose\",\n      step1_s:\"Orari, dosi, promemoria rifornimenti — pensati per la cura cronica.\",\n      step2_t:\"Trova le tendenze dei sintomi\",\n      step2_s:\"Intensità 0–5 con foto. Vedi i miglioramenti in un colpo d'occhio.\",\n      step3_t:\"Condividi col veterinario\",\n      step3_s:\"Un PDF chiaro: aderenza, sintomi, vaccini — fatto.\",\n      step4_t:\"Cura in famiglia\",\n      step4_s:\"Invita partner, famiglia, dog-sitter. Niente dosi doppie, niente avvisi persi.\",\n      screen2_h4:\"Luna\", screen2_day:\"Sintomi · ultimi 7 giorni\",\n      screen2_events:\"Eventi\", screen2_intensity:\"Intensità media\", screen2_trend:\"Migliorato\",\n      screen2_sym1:\"Letargia\", screen2_sym2:\"Più sete\",\n      screen2_sym3:\"Crisi epilettica\", screen2_sym4:\"Tosse\",\n      when_today:\"Oggi\", when_yest:\"Ieri\", when_yest_short:\"Ieri\",\n      screen3_h4:\"Report Salute\", screen3_day:\"Ultimi 30 giorni\",\n      screen3_adh_lbl:\"Aderenza terapia\", screen3_adh_pill:\"Stabile\",\n      screen3_adh_sub:\"Caninsulin · Fenobarbital\",\n      screen3_sym_lbl:\"Sintomi\", screen3_sym_pill:\"↓ Migliorato\",\n      screen3_sym_sub:\"Registrati in 7 giorni\",\n      screen3_vax_lbl:\"Prossimo vaccino\", screen3_vax_pill:\"In programma\",\n      screen3_vax_in:\"tra 12 giorni\", screen3_vax_sub:\"Avvisi · 30/7/1 giorni\",\n      screen3_share:\"Condividi PDF col vet\",\n      screen4_h4:\"Luna · Famiglia\", screen4_day:\"3 caregiver\",\n      role_owner:\"Proprietaria\", role_family:\"Famiglia\", role_sitter:\"Sitter\",\n      screen4_act1:\"ha dato Caninsulin\", screen4_act2:\"ha registrato \\\"Letargia\\\"\",\n      screen4_act3:\"ha confermato visita vet\", screen4_act3_sub:\"Ven 16:30 · Dr. Rossi\",\n      screen4_invite:\"Invita la famiglia\",\n      feat_eyebrow:\"Cosa ottieni\", feat_h:\"Tutto ciò che serve davvero per la cura di un pet cronico.\",\n      feat_sub:\"Una sola app — farmaci, sintomi, vaccini, visite, documenti, e la famiglia che si prende cura insieme a te.\",\n      f1_t:\"Gestione farmaci intelligente\",\n      f1_p:\"Orari, dosi, promemoria rifornimenti, sito di iniezione, supporto al bisogno. Tocca per registrare una dose somministrata — valore reale, non solo prescritto.\",\n      f2_t:\"Scheda d'emergenza\",\n      f2_p:\"Un PDF con tutto ciò che servirà al veterinario o al pet-sitter: contatti, patologie, allergie, terapie in corso, sintomi recenti.\",\n      f3_t:\"Supporto multi-patologia\",\n      f3_p:\"Diabete, epilessia, reni, cuore, allergie, ipotiroidismo, Cushing — più patologie in un solo posto. Non un'app per malattia.\",\n      f4_t:\"Vaccini & visite\",\n      f4_p:\"Calendario vaccinale completo con avvisi di scadenza (30/7/1 giorni prima). Registro visite con costi e follow-up.\",\n      f5_t:\"Tracciamento sintomi\",\n      f5_p:\"Registra sintomi con intensità 0–5, eventi multipli, foto. Riconosci le tendenze — migliorato, peggiorato, stabile.\",\n      f6_t:\"Condivisione famiglia\",\n      f6_p:\"Invita partner, famiglia o pet-sitter. Logica anti-doppia-dose. Avvisi a tutta la famiglia se una dose viene persa per 60 min.\",\n      typo_p:\"Noi tracciamo. Tu ti prendi cura.\",\n      rep_eyebrow:\"Per il tuo veterinario\",\n      rep_h:\"Da appunti sparsi a un report di salute chiaro.\",\n      rep_sub:\"Aderenza, sintomi, stato vaccinale — pronti per il tuo veterinario in pochi secondi.\",\n      rep_before_ey:\"Prima di Sereno\", rep_before_h:\"Carta sgualcita. Mezzo ricordata.\",\n      rep_before_p:\"Orari scarabocchiati, appunti persi, messaggi WhatsApp che si contraddicono.\",\n      rep_after_ey:\"Con Sereno\", rep_after_h:\"PDF chiaro. Pronto in secondi.\",\n      rep_after_p:\"Aderenza, sintomi, vaccini — già pronti per il vet.\",\n      rep_foot:\"Disponibile nell'app →\",\n      pri_eyebrow:\"Prezzi\",\n      pri_h:\"Prezzi semplici. Gratis per sempre per un pet.\",\n      pri_sub:\"Parti gratis, passa al piano successivo solo quando ti servono pet illimitati, condivisione famiglia e escalation dosi.\",\n      pri_monthly:\"Mensile\", pri_yearly:\"Annuale\", pri_save:\"Risparmi 35%\",\n      plan_free:\"Gratis\", plan_free_sub:\"Per sempre gratis\", plan_pop:\"Più scelto\",\n      plan_plus_sub_y:\"Risparmi 35% · 7 giorni gratis\",\n      plan_plus_sub_m:\"7 giorni di prova gratuita\",\n      plan_pro_sub:\"Tutto Plus, e di più\",\n      plan_free_cta:\"Inizia gratis\", plan_plus_cta:\"Prova Plus gratis per 7 giorni\", plan_pro_cta:\"Passa a Pro\",\n      b_1pet:\"1 pet\", b_2med:\"2 farmaci\", b_5doc:\"5 documenti\",\n      b_1fam:\"1 familiare\", b_vse:\"Vaccini, visite, sintomi, Scheda d'emergenza\",\n      b_upet:\"Pet illimitati\", b_umed:\"Farmaci illimitati\", b_udoc:\"Documenti illimitati\",\n      b_fam5:\"Condivisione famiglia (fino a 5)\", b_esc:\"Escalation dosi in famiglia\",\n      b_sync:\"Sync su più dispositivi\",\n      b_eip:\"Tutto di Plus\", b_vvr:\"Promemoria visite vet\",\n      b_asa:\"Analisi avanzata dei sintomi\", b_pri:\"Supporto prioritario\",\n      b_eaf:\"Accesso anticipato alle novità\",\n      pri_legal:\"Rinnovo automatico. Disdici quando vuoi dal tuo account App Store / Play Store. Prezzi in USD; in app vedi la tua valuta locale.\",\n      faq_eyebrow:\"Domande\", faq_h:\"Domande frequenti.\",\n      faq_q1:\"Sereno funziona offline?\",\n      faq_a1:\"Sì, in sola lettura sui dati già sincronizzati. Le nuove voci si sincronizzano appena torni online.\",\n      faq_q2:\"Posso condividere col mio veterinario?\",\n      faq_a2:\"Sì — genera una Scheda d'emergenza PDF o un Report Salute completo e condividilo via email, WhatsApp o qualsiasi app.\",\n      faq_q3:\"Posso cambiare piano in qualsiasi momento?\",\n      faq_a3:\"Sì, puoi passare a un piano superiore o inferiore quando vuoi. I downgrade hanno effetto al termine del periodo di fatturazione corrente.\",\n      faq_q4:\"Cosa succede ai miei dati se cancello l'abbonamento?\",\n      faq_a4:\"I tuoi dati restano nel tuo account. Mantieni l'accesso in lettura ai dati esistenti su Gratis; le nuove voci seguono i limiti del piano Gratis.\",\n      faq_q5:\"Sereno è disponibile in altre lingue?\",\n      faq_a5:\"Sì — Inglese, Italiano, Spagnolo. L'app rileva automaticamente la lingua del dispositivo e ti permette di cambiarla manualmente.\",\n      faq_q6:\"È disponibile su iPhone e Android?\",\n      faq_a6:\"Entrambi. Stessi dati, stesso account, sync in tempo reale tra i dispositivi.\",\n      faq_q7:\"I dati del mio pet sono privati?\",\n      faq_a7:\"Sì. I dati sono cifrati su server europei (Supabase, regione Stoccolma). Puoi esportare o eliminare il tuo account quando vuoi. Sereno non vende né condivide i tuoi dati.\",\n      faq_q8:\"Sereno sostituisce il veterinario?\",\n      faq_a8:\"No. Sereno è uno strumento di tracciamento e condivisione. Non diagnostica, non prescrive e non sostituisce il parere veterinario professionale.\",\n      final_eyebrow:\"Pronto?\", final_h:\"Inizia a prenderti cura con serenità, oggi.\",\n      final_sub:\"Gratis per sempre per un pet. Nessuna carta di credito.\",\n      foot_product:\"Prodotto\", foot_legal:\"Legale\", foot_contact:\"Contatti\",\n      foot_privacy:\"Privacy\", foot_terms:\"Termini\",\n      foot_madein:\"Realizzato con cura in Italia.\"\n    },\n    es: {\n      nav_features:\"Funcionalidades\", nav_pricing:\"Precios\", nav_faq:\"FAQ\", nav_cta:\"Descargar la app\",\n      hero_eyebrow:\"Rastreador de salud para mascotas con condiciones crónicas\",\n      hero_h:\"Cuida a tu mascota, con confianza.\",\n      hero_sub:\"Nunca pierdas datos. Nunca olvides una dosis. Nunca llegues al veterinario sin preparación. Diseñado para mascotas diabéticas, epilépticas y con condiciones crónicas — y perfecto para cualquier mascota.\",\n      hero_trust:'Disponible en Inglés<span class=\"sep\">·<\u002Fspan>Italiano<span class=\"sep\">·<\u002Fspan>Español<span class=\"sep\">·<\u002Fspan>iPhone &amp; Android<span class=\"sep\">·<\u002Fspan>compatible RGPD',\n      store_appstore_small:\"Descargar en\", store_appstore_big:\"App Store\",\n      store_googleplay_small:\"Disponible en\", store_googleplay_big:\"Google Play\",\n      know_h:\"Sabemos lo que se siente.\", know_sub:\"Porque también lo vivimos.\",\n      filter_all:\"Todos\", filter_chronic:\"Cuidado crónico\", filter_everyday:\"Cuidado diario\",\n      testi_emma_tag:\"Beagle diabética\",\n      testi_emma_q:'\"Apuntaba los horarios de la insulina de Luna en un cuaderno. Lo perdí durante una visita al vet. Nunca más.\"',\n      testi_marco_tag:\"Mestizo epiléptico\",\n      testi_marco_q:'\"Seguir cada crisis significaba cinco apps distintas y tres chats. Ahora es una sola pantalla.\"',\n      testi_carmen_tag:\"Enfermedad renal\",\n      testi_carmen_q:'\"Mi veterinaria me abrazó cuando le pasé el PDF. Me dijo que nadie le lleva nunca datos tan claros.\"',\n      testi_sarah_tag:\"Labrador senior sano\",\n      testi_sarah_q:'\"Bella está perfectamente sana a sus 11. Solo quiero cada vacuna, cada visita, cada control de peso en un mismo sitio — Sereno hace eso.\"',\n      testi_james_tag:\"Síndrome de Cushing\",\n      testi_james_q:'\"Trilostano dos veces al día, analíticas mensuales, agua cada semana. Tenía la cabeza a tope. Ahora la lleva el móvil.\"',\n      testi_yuki_tag:\"Shiba sana\",\n      testi_yuki_q:'\"Mochi está sana y quiero que siga así. Avisos de vacunas, recordatorios anuales, gráfico de crecimiento — tranquilidad.\"',\n      life_eyebrow:\"Para cada mascota\",\n      life_h:\"Cualquiera que sea la etapa, Sereno acompaña.\",\n      life_young_h:\"Jóvenes & en crecimiento\",\n      life_young_p:\"Calendario de vacunas desde las 6 semanas. Gráfico de crecimiento. Microchip.\",\n      life_adult_h:\"Adulto sano\",\n      life_adult_p:\"Revisiones anuales, control de peso, limpieza dental, prevención de parásitos.\",\n      life_senior_h:\"Cuidado senior\",\n      life_senior_p:\"Tendencia de analíticas, suplementos, movilidad, frecuencia de visitas.\",\n      life_chronic_h:\"Condiciones crónicas\",\n      life_chronic_p:\"Medicación diaria, multi-condición, escalado familiar, PDF para el vet.\",\n      stat_symptoms:\"Síntomas rastreados\", stat_vaccines:\"Vacunas preconfig.\",\n      stat_languages:\"Idiomas\", stat_ads:\"Anuncios. Nunca.\",\n      hiw_eyebrow:\"Cómo funciona\", hiw_h:\"Cuidado, en cada pantalla.\",\n      hiw_sub:\"De la insulina de la mañana a la cita con el vet — Sereno cubre cada momento.\",\n      step1_t:\"Registra cada dosis\",\n      step1_s:\"Horarios, dosis, recordatorios — pensado para el cuidado crónico.\",\n      step2_t:\"Detecta tendencias de síntomas\",\n      step2_s:\"Intensidad 0–5 con fotos. Ve la mejora de un vistazo.\",\n      step3_t:\"Comparte con tu vet\",\n      step3_s:\"Un PDF limpio: adherencia, síntomas, vacunas — hecho.\",\n      step4_t:\"Cuida en familia\",\n      step4_s:\"Invita a pareja, familia, cuidador. Sin doble dosis, sin avisos perdidos.\",\n      screen2_h4:\"Luna\", screen2_day:\"Síntomas · últimos 7 días\",\n      screen2_events:\"Eventos\", screen2_intensity:\"Intensidad media\", screen2_trend:\"Mejorando\",\n      screen2_sym1:\"Letargo\", screen2_sym2:\"Más sed\",\n      screen2_sym3:\"Crisis epiléptica\", screen2_sym4:\"Tos\",\n      when_today:\"Hoy\", when_yest:\"Ayer\", when_yest_short:\"Ayer\",\n      screen3_h4:\"Informe de salud\", screen3_day:\"Últimos 30 días\",\n      screen3_adh_lbl:\"Adherencia a medicación\", screen3_adh_pill:\"Estable\",\n      screen3_adh_sub:\"Caninsulin · Fenobarbital\",\n      screen3_sym_lbl:\"Síntomas\", screen3_sym_pill:\"↓ Mejorando\",\n      screen3_sym_sub:\"Registrados en 7 días\",\n      screen3_vax_lbl:\"Próxima vacuna\", screen3_vax_pill:\"Al día\",\n      screen3_vax_in:\"en 12 días\", screen3_vax_sub:\"Recordatorio · 30/7/1 días\",\n      screen3_share:\"Compartir PDF con vet\",\n      screen4_h4:\"Luna · Familia\", screen4_day:\"3 cuidadores\",\n      role_owner:\"Dueña\", role_family:\"Familia\", role_sitter:\"Cuidadora\",\n      screen4_act1:\"dio Caninsulin\", screen4_act2:\"registró \\\"Letargo\\\"\",\n      screen4_act3:\"confirmó cita vet\", screen4_act3_sub:\"Vie 16:30 · Dra. Rossi\",\n      screen4_invite:\"Invitar a familia\",\n      feat_eyebrow:\"Lo que obtienes\", feat_h:\"Todo lo que el cuidado crónico necesita.\",\n      feat_sub:\"Una sola app — medicación, síntomas, vacunas, visitas, documentos, y la familia que cuida contigo.\",\n      f1_t:\"Gestión inteligente de medicación\",\n      f1_p:\"Horarios, dosis, recordatorios de reposición, zona de inyección, soporte por necesidad. Toca para registrar una dosis — valor real, no solo el prescrito.\",\n      f2_t:\"Tarjeta de emergencia\",\n      f2_p:\"Un PDF con lo que tu vet o cuidador necesita: contacto, condiciones, alergias, medicación actual, síntomas recientes.\",\n      f3_t:\"Soporte multi-condición\",\n      f3_p:\"Diabetes, epilepsia, riñón, cardíaco, alergias, hipotiroidismo, Cushing — varias condiciones en un solo lugar. No una app por enfermedad.\",\n      f4_t:\"Vacunas & visitas\",\n      f4_p:\"Calendario vacunal completo con alertas de caducidad (30/7/1 días antes). Registro de visitas con costes y seguimiento.\",\n      f5_t:\"Seguimiento de síntomas\",\n      f5_p:\"Registra síntomas con intensidad 0–5, eventos múltiples, fotos. Ve tendencias — mejor, peor, estable.\",\n      f6_t:\"Compartido en familia\",\n      f6_p:\"Invita a pareja, familia o cuidador. Lógica anti-doble-dosis. Aviso a toda la familia si se pierde una dosis durante 60 min.\",\n      typo_p:\"Nosotros rastreamos. Tú cuidas.\",\n      rep_eyebrow:\"Para tu veterinario\",\n      rep_h:\"De notas dispersas a un informe de salud claro.\",\n      rep_sub:\"Adherencia, síntomas y vacunas — listos para tu vet en segundos.\",\n      rep_before_ey:\"Antes de Sereno\", rep_before_h:\"Papel arrugado. Medio recordado.\",\n      rep_before_p:\"Horarios escritos a mano, notas perdidas, mensajes de WhatsApp contradictorios.\",\n      rep_after_ey:\"Con Sereno\", rep_after_h:\"PDF claro. Listo en segundos.\",\n      rep_after_p:\"Adherencia, síntomas y vacunas — listos para tu vet.\",\n      rep_foot:\"Disponible en la app →\",\n      pri_eyebrow:\"Precios\",\n      pri_h:\"Precios simples. Gratis para siempre para una mascota.\",\n      pri_sub:\"Empieza gratis, sube de plan solo cuando necesites mascotas ilimitadas, compartido en familia y esca ratis; las nuevas entradas siguen los límites del plan Gratis.\",\n      faq_q5:\"¿Sereno está en otros idiomas?\",\n      faq_a5:\"Sí — Inglés, Italiano, Español. La app detecta el idioma del dispositivo y te permite cambiarlo manualmente.\",\n      faq_q6:\"¿Está en iPhone y Android?\",\n      faq_a6:\"Los dos. Mismos datos, misma cuenta, sincronización en tiempo real entre dispositivos.\",\n      faq_q7:\"¿Los datos de mi mascota son privados?\",\n      faq_a7:\"Sí. Los datos se almacenan cifrados en servidores europeos (Supabase, región Estocolmo). Puedes exportar o eliminar tu cuenta cuando quieras. Sereno nunca vende ni comparte tus datos.\",\n      faq_q8:\"¿Sereno reemplaza al veterinario?\",\n      faq_a8:\"No. Sereno es una herramienta de seguimiento y compartido. No diagnostica, no prescribe y no sustituye el consejo veterinario profesional.\",\n      final_eyebrow:\"¿Listo?\", final_h:\"Empieza a cuidar con confianza, hoy.\",\n      final_sub:\"Gratis para siempre para una mascota. Sin tarjeta de crédito.\",\n      foot_product:\"Producto\", foot_legal:\"Legal\", foot_contact:\"Contacto\",\n      foot_privacy:\"Privacidad\", foot_terms:\"Términos\",\n      foot_madein:\"Hecho con cariño en Italia.\"\n    }\n  };\n\n  // Detect language\n  function detectLang(){\n    const url = new URL(window.location.href);\n    const qp = url.searchParams.get('lang');\n    if (qp && I18N[qp]) return qp;\n    const stored = localStorage.getItem('sereno_lang');\n    if (stored && I18N[stored]) return stored;\n    const browser = (navigator.language || 'en').slice(0,2).toLowerCase();\n    if (I18N[browser]) return browser;\n    return 'en';\n  }\n\n  let lang = detectLang();\n\n  function applyI18n(targetLang){\n    const dict = I18N[targetLang] || I18N.en;\n    document.documentElement.lang = targetLang;\n    document.body.setAttribute('data-lang', targetLang);\n    document.querySelectorAll('[data-i18n]').forEach(el => {\n      const k = el.getAttribute('data-i18n');\n      const v = dict[k];\n      if (v == null) return;\n      // hero_trust uses HTML (with span seps), most others are plain text\n      if (k === 'hero_trust') el.innerHTML = v;\n      else el.textContent = v;\n    });\n    // Plus sub: depends on billing mode\n    const plusSub = document.getElementById('plus-sub');\n    if (plusSub){\n      plusSub.textContent = currentBilling === 'yearly'\n        ? dict.plan_plus_sub_y\n        : dict.plan_plus_sub_m;\n    }\n  }\n\n  // ── BASICS (always run) ─────────────────────────────\n  const nav = document.getElementById('nav');\n  const onScroll = () => nav.classList.toggle('is-scrolled', window.scrollY > 8);\n  window.addEventListener('scroll', onScroll, {passive:true}); onScroll();\n\n  const sheet = document.getElementById('sheet');\n  const burger = document.getElementById('burger');\n  const sheetClose = document.getElementById('sheet-close');\n  const openSheet = () => { sheet.classList.add('open'); sheet.setAttribute('aria-hidden','false'); burger.setAttribute('aria-expanded','true'); };\n  const closeSheet = () => { sheet.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); burger.setAttribute('aria-expanded','false'); };\n  burger.addEventListener('click', openSheet);\n  sheetClose.addEventListener('click', closeSheet);\n  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });\n  sheet.querySelectorAll('[data-close]').forEach(a => a.addEventListener('click', closeSheet));\n\n  // FAQ accordion\n  document.querySelectorAll('.faq-item').forEach(item => {\n    const q = item.querySelector('.faq-q');\n    const a = item.querySelector('.faq-a');\n    q.addEventListener('click', () => {\n      const isOpen = item.classList.contains('open');\n      document.querySelectorAll('.faq-item.open').forEach(o => {\n        o.classList.remove('open');\n        o.querySelector('.faq-a').style.maxHeight = '0px';\n        o.querySelector('.faq-q').setAttribute('aria-expanded','false');\n      });\n      if (!isOpen) {\n        item.classList.add('open');\n        a.style.maxHeight = a.scrollHeight + 'px';\n        q.setAttribute('aria-expanded','true');\n      }\n    });\n  });\n\n  // Testimonial filter chips\n  const filterButtons = document.querySelectorAll('.kf');\n  const knowGrid = document.getElementById('know-grid');\n  filterButtons.forEach(btn => {\n    btn.addEventListener('click', () => {\n      const cat = btn.dataset.filter;\n      filterButtons.forEach(b => {\n        const on = b === btn;\n        b.classList.toggle('active', on);\n        b.setAttribute('aria-selected', on);\n      });\n      if (!knowGrid) return;\n      knowGrid.querySelectorAll('.quote-card').forEach(card => {\n        const show = cat === 'all' || card.dataset.cat === cat;\n        card.classList.toggle('hidden', !show);\n      });\n      if (window.ScrollTrigger) ScrollTrigger.refresh();\n    });\n  });\n\n  // ── I.2.c — Build mobile HIW clone (vertical, unpinned) ──\n  function buildHiwMobile(){\n    if (document.querySelector('.hiw-mobile')) return;\n    const screens = document.querySelectorAll('.hiw-screen');\n    const steps   = document.querySelectorAll('.hiw-step');\n    const howitworks = document.querySelector('.howitworks');\n    if (!howitworks || !screens.length) return;\n\n    const mobileContainer = document.createElement('div');\n    mobileContainer.className = 'hiw-mobile';\n\n    screens.forEach((screen, i) => {\n      const step = steps[i];\n      if (!step) return;\n      const card = document.createElement('article');\n      card.className = 'him-card';\n\n      // step header\n      const titleEl = step.querySelector('.lbl > span[data-i18n^=\"step\"]');\n      const subEl   = step.querySelector('.lbl small');\n      const numText = step.querySelector('.num').textContent;\n      const titleK  = titleEl ? titleEl.getAttribute('data-i18n') : '';\n      const subK    = subEl   ? subEl.getAttribute('data-i18n')   : '';\n\n      card.innerHTML =\n        '<header class=\"him-head\">' +\n          '<span class=\"him-num\">' + numText + '<\u002Fspan>' +\n          '<div>' +\n            '<h3 data-i18n=\"' + titleK + '\">' + (titleEl ? titleEl.textContent : '') + '<\u002Fh3>' +\n            '<p data-i18n=\"' + subK + '\">' + (subEl ? subEl.textContent : '') + '<\u002Fp>' +\n          '<\u002Fdiv>' +\n        '<\u002Fheader>' +\n        '<div class=\"phone him-phone\">' +\n          '<div class=\"phone-screen\">' +\n            '<div class=\"phone-notch\"><\u002Fdiv>' +\n            '<div class=\"phone-status\">' +\n              '<span>9:41<\u002Fspan>' +\n              '<span class=\"status-icons\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span class=\"battery\"><\u002Fspan><\u002Fspan>' +\n            '<\u002Fdiv>' +\n            '<div class=\"him-screen-body\"><\u002Fdiv>' +\n          '<\u002Fdiv>' +\n        '<\u002Fdiv>';\n\n      // clone the screen content (children only, not the wrapper)\n      const body = card.querySelector('.him-screen-body');\n      [...screen.childNodes].forEach(node => body.appendChild(node.cloneNode(true)));\n      mobileContainer.appendChild(card);\n    });\n\n    howitworks.appendChild(mobileContainer);\n  }\n  // Only build when needed (touch OR small viewport)\n  if (touch || !desktop) buildHiwMobile();\n\n  // HIW step click — scroll into step segment\n  const hiwSteps = [...document.querySelectorAll('.hiw-step')];\n  const hiwScreens = [...document.querySelectorAll('.hiw-screen')];\n  const setHiwStep = (i) => {\n    hiwSteps.forEach((el, idx) => el.classList.toggle('active', idx === i));\n    hiwScreens.forEach((el, idx) => el.classList.toggle('active', idx === i));\n  };\n\n  // Pricing toggle\n  const btnMonthly = document.getElementById('bill-monthly');\n  const btnYearly  = document.getElementById('bill-yearly');\n  const plusSubEl  = document.getElementById('plus-sub');\n  const amts       = [...document.querySelectorAll('.price-amount[data-monthly]')];\n  let currentBilling = 'yearly';\n\n  function applyText(box, mode){\n    const roll = box.querySelector('.stack-roll');\n    roll.querySelector('.num').textContent = box.dataset[mode];\n    const perKey = 'per' + mode.charAt(0).toUpperCase() + mode.slice(1);\n    roll.querySelector('.per').textContent = box.dataset[perKey];\n  }\n\n  function setBilling(mode){\n    if (mode === currentBilling) return;\n    currentBilling = mode;\n    btnMonthly.classList.toggle('active', mode==='monthly');\n    btnYearly .classList.toggle('active', mode==='yearly');\n    btnMonthly.setAttribute('aria-selected', mode==='monthly');\n    btnYearly .setAttribute('aria-selected', mode==='yearly');\n    const dict = I18N[lang] || I18N.en;\n    plusSubEl.textContent = mode === 'yearly' ? dict.plan_plus_sub_y : dict.plan_plus_sub_m;\n\n    if (window.gsap && !reduced){\n      amts.forEach(box => {\n        const roll = box.querySelector('.stack-roll');\n        gsap.to(roll, {y: 22, opacity: 0, duration: .22, ease: 'power2.in', onComplete: () => {\n          applyText(box, mode);\n          gsap.fromTo(roll, {y: -22, opacity: 0}, {y: 0, opacity: 1, duration: .28, ease: 'power2.out'});\n        }});\n      });\n      const pill = document.querySelector('.save-pill');\n      if (pill) gsap.fromTo(pill, {scale: 1}, {scale: 1.22, duration: .15, ease: 'power2.out', yoyo: true, repeat: 1});\n      gsap.fromTo('.price-card', {y: 0}, {y: -2, duration: .15, ease: 'power2.out', yoyo: true, repeat: 1, stagger: .03});\n    } else {\n      amts.forEach(box => applyText(box, mode));\n    }\n  }\n  btnMonthly.addEventListener('click', () => setBilling('monthly'));\n  btnYearly .addEventListener('click', () => setBilling('yearly'));\n\n  // ── Apply initial i18n now (before reveal-related rendering) ──\n  applyI18n(lang);\n\n  // ── LANGUAGE SWITCHER ──\n  const langWrap = document.getElementById('lang');\n  const langBtn  = document.getElementById('lang-btn');\n  const langMenu = document.getElementById('lang-menu');\n  const langFlag = document.getElementById('lang-current-flag');\n  const langCode = document.getElementById('lang-current-code');\n  const FLAG_SVG = {\n    en:'<svg class=\"flag-svg\" viewBox=\"0 0 60 30\" aria-hidden=\"true\"><rect width=\"60\" height=\"30\" fill=\"#012169\"/><path d=\"M0,0 L60,30 M60,0 L0,30\" stroke=\"#fff\" stroke-width=\"6\"/><path d=\"M0,0 L60,30 M60,0 L0,30\" stroke=\"#C8102E\" stroke-width=\"3\"/><path d=\"M30,0 v30 M0,15 h60\" stroke=\"#fff\" stroke-width=\"10\"/><path d=\"M30,0 v30 M0,15 h60\" stroke=\"#C8102E\" stroke-width=\"6\"/><\u002Fsvg>',\n    it:'<svg class=\"flag-svg\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect width=\"1\" height=\"2\" x=\"0\" fill=\"#009246\"/><rect width=\"1\" height=\"2\" x=\"1\" fill=\"#fff\"/><rect width=\"1\" height=\"2\" x=\"2\" fill=\"#CE2B37\"/><\u002Fsvg>',\n    es:'<svg class=\"flag-svg\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect width=\"3\" height=\"2\" fill=\"#AA151B\"/><rect width=\"3\" height=\"1\" y=\".5\" fill=\"#F1BF00\"/><\u002Fsvg>'\n  };\n  function refreshLangButton(){\n    if (langFlag) langFlag.innerHTML = FLAG_SVG[lang];\n    if (langCode) langCode.textContent = lang.toUpperCase();\n    document.querySelectorAll('.lang-item').forEach(it => it.classList.toggle('active', it.dataset.lang === lang));\n    document.querySelectorAll('.sheet-lang-item').forEach(it => it.classList.toggle('active', it.dataset.lang === lang));\n  }\n  refreshLangButton();\n  if (langBtn){\n    langBtn.addEventListener('click', (e) => {\n      e.stopPropagation();\n      langWrap.classList.toggle('open');\n      langBtn.setAttribute('aria-expanded', langWrap.classList.contains('open'));\n    });\n  }\n  function switchLang(next){\n    if (!I18N[next] || next === lang) return;\n    lang = next;\n    localStorage.setItem('sereno_lang', lang);\n    const url = new URL(window.location.href);\n    url.searchParams.set('lang', lang);\n    history.replaceState(null, '', url.toString());\n    document.body.classList.add('i18n-swap');\n    setTimeout(() => {\n      applyI18n(lang);\n      refreshLangButton();\n      document.body.classList.remove('i18n-swap');\n      if (window.ScrollTrigger) ScrollTrigger.refresh();\n    }, 160);\n  }\n\n  document.querySelectorAll('.lang-item').forEach(it => {\n    it.addEventListener('click', () => {\n      switchLang(it.dataset.lang);\n      langWrap.classList.remove('open');\n      langBtn.setAttribute('aria-expanded', 'false');\n    });\n  });\n  document.querySelectorAll('.sheet-lang-item').forEach(it => {\n    it.addEventListener('click', () => {\n      switchLang(it.dataset.lang);\n      // keep sheet open per spec\n    });\n  });\n  document.addEventListener('click', (e) => {\n    if (langWrap && !langWrap.contains(e.target)) {\n      langWrap.classList.remove('open');\n      if (langBtn) langBtn.setAttribute('aria-expanded','false');\n    }\n  });\n\n  // ── Fallback for no GSAP / reduced motion\n  function fallbackReveal(){\n    document.querySelectorAll('.reveal, .reveal-rot').forEach(el => el.classList.add('in'));\n    document.documentElement.classList.remove('do-intro');\n    const c = document.getElementById('intro-curtain');\n    if (c) c.style.display = 'none';\n    const p = document.getElementById('preloader');\n    if (p) p.style.display = 'none';\n    setHiwStep(0);\n    // counters: just show the numbers\n    document.querySelectorAll('.sn[data-count]').forEach(el => el.textContent = el.dataset.count);\n  }\n\n  function whenReady(fn){\n    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, {once:true});\n    else fn();\n  }\n\n  whenReady(() => {\n    // Cursor orb (always wired if hover-capable + not reduced motion)\n    if (canHover && desktop && !reduced){\n      const orb = document.getElementById('cursor-orb');\n      if (orb){\n        document.body.classList.add('cursor-on');\n        // Instant follow — no lag, no interpolation.\n        window.addEventListener('mousemove', e => {\n          orb.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%,-50%)`;\n        }, { passive: true });\n        // hover detection via delegation (scale + color transition stays in CSS)\n        const hoverSel = 'a, button, .clickable, .kf, .lang-item, .quote-card';\n        document.addEventListener('mouseover', e => {\n          if (e.target.closest && e.target.closest(hoverSel)) orb.classList.add('hover');\n        });\n        document.addEventListener('mouseout', e => {\n          if (e.target.closest && e.target.closest(hoverSel)) orb.classList.remove('hover');\n        });\n      }\n    }\n\n    if (reduced || !window.gsap || !window.ScrollTrigger){\n      fallbackReveal();\n      return;\n    }\n\n    gsap.registerPlugin(ScrollTrigger);\n    if (window.ScrollToPlugin) gsap.registerPlugin(ScrollToPlugin);\n    document.querySelectorAll('.reveal, .reveal-rot').forEach(el => el.style.transition = 'none');\n    gsap.set('.hero .reveal', { opacity: 1, y: 0, clearProps: 'transform' });\n\n    // ── G.6.a + E.1 — PRELOADER + INTRO ───────────────\n    const preloader = document.getElementById('preloader');\n    const curtain   = document.getElementById('intro-curtain');\n\n    function runHeroIntro(){\n      if (touch){\n        // I.2 — simplified mobile intro: just fade-in cascade\n        const tl = gsap.timeline({\n          defaults: { ease: 'power2.out', duration: .4 },\n          onComplete: () => {\n            if (curtain) curtain.remove();\n            document.documentElement.classList.remove('do-intro');\n            sessionStorage.setItem('sereno-intro-played', '1');\n            ScrollTrigger.refresh();\n          }\n        });\n        tl.to('#intro-curtain', { opacity: 0, duration: .3 }, 0);\n        tl.fromTo('.heartbeat, .wordmark, .eyebrow, .headline, .subhead, .pet-photo, .phone-float, .cta-row > *, .trust-row',\n          { opacity: 0, y: 10 },\n          { opacity: 1, y: 0, stagger: .05 }, 0.1);\n        return;\n      }\n\n      const tl = gsap.timeline({\n        defaults: { ease: 'power3.out' },\n        onComplete: () => {\n          if (curtain) curtain.remove();\n          document.documentElement.classList.remove('do-intro');\n          sessionStorage.setItem('sereno-intro-played', '1');\n          ScrollTrigger.refresh();\n        }\n      });\n      tl.fromTo('.intro-paw',\n        { scale: .6, opacity: 0 },\n        { scale: 1, opacity: 1, duration: .45, ease: 'elastic.out(1, .55)' }, 0);\n      tl.to('.intro-paw',\n        { scale: .35, opacity: 0, duration: .3, ease: 'power2.inOut' }, .45);\n      tl.to('#intro-curtain',\n        { opacity: 0, duration: .4, ease: 'power2.out' }, .45);\n      tl.fromTo('.heartbeat',\n        { opacity: 0, scale: .6 },\n        { opacity: 1, scale: 1, duration: .5, ease: 'back.out(2)' }, .4);\n      tl.fromTo('.wordmark',\n        { opacity: 0, y: 30, skewY: 4 },\n        { opacity: 1, y: 0, skewY: 0, duration: .55 }, .55);\n      tl.fromTo('.eyebrow',     { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .45 }, .7);\n      tl.fromTo('.headline',    { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .5  }, .75);\n      tl.fromTo('.subhead',     { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .5  }, .85);\n      tl.fromTo('.pet-photo',\n        { opacity: 0, scale: 1.08 },\n        { opacity: 1, scale: 1, duration: .85, ease: 'power2.out' }, .6);\n      tl.fromTo('.phone-float',\n        { opacity: 0, x: 60, y: 60, rotation: -10 },\n        { opacity: 1, x: 0, y: 0, rotation: -4, duration: .85, ease: 'back.out(1.3)' }, .85);\n      tl.fromTo('.cta-row > *',\n        { opacity: 0, y: 14 },\n        { opacity: 1, y: 0, duration: .35, stagger: .08 }, 1.05);\n      tl.fromTo('.trust-row',\n        { opacity: 0, y: 14 },\n        { opacity: 1, y: 0, duration: .35 }, 1.2);\n    }\n\n    if (doIntro && preloader){\n      // G.6.a — preloader timeline: paw appears, ring draws, wipe up\n      const PL_DUR = touch ? 0.6 : 1.0;   // I.2 — faster on mobile\n      const plTl = gsap.timeline({\n        defaults: { ease: 'power2.out' },\n        onComplete: () => { preloader.remove(); runHeroIntro(); }\n      });\n      plTl.fromTo('.pl-paw',\n        { opacity: 0, scale: .9 },\n        { opacity: 1, scale: 1, duration: PL_DUR * 0.4 }, 0);\n      plTl.fromTo('.pl-ring circle',\n        { strokeDasharray: '0 999' },\n        { strokeDasharray: '390 999', duration: PL_DUR * 0.55, ease: 'power2.inOut' }, PL_DUR * 0.15);\n      plTl.to('.pl-ring',\n        { rotate: 270, duration: PL_DUR * 0.65, ease: 'power2.inOut', transformOrigin: '50% 50%' }, PL_DUR * 0.15);\n      plTl.to('#preloader',\n        { y: '-100%', duration: PL_DUR * 0.55, ease: 'power3.inOut' }, PL_DUR * 0.85);\n      plTl.to(['.pl-paw', '.pl-ring'],\n        { opacity: 0, duration: PL_DUR * 0.3 }, PL_DUR * 0.85);\n    } else if (doIntro && curtain){\n      runHeroIntro();\n      if (preloader) preloader.remove();\n    } else {\n      document.documentElement.classList.remove('do-intro');\n      if (curtain) curtain.remove();\n      if (preloader) preloader.remove();\n    }\n\n    // ── E.6 — STAGGER REVEALS ──\n    const revealEls = [...document.querySelectorAll('.reveal')].filter(el => !el.closest('.hero'));\n    ScrollTrigger.batch(revealEls, {\n      start: 'top 80%',\n      onEnter: batch => gsap.to(batch, { opacity: 1, y: 0, duration: .7, stagger: .06, ease: 'power3.out', overwrite: 'auto' })\n    });\n    ScrollTrigger.batch('.reveal-rot', {\n      start: 'top 80%',\n      onEnter: batch => gsap.to(batch, { opacity: 1, y: 0, rotation: 0, duration: .7, stagger: .09, ease: 'power3.out', overwrite: 'auto' })\n    });\n\n    // ── E.3 — Hero photo scrub zoom (desktop only — too jittery on touch) ──\n    if (!touch){\n      gsap.to('.pet-photo', {\n        scale: 1.08, y: -22, ease: 'none',\n        scrollTrigger: { trigger: '.hero', start: 'top top', end: '+=600', scrub: true }\n      });\n    }\n\n    // ── G.6.b — Stats counter ──\n    document.querySelectorAll('.sn[data-count]').forEach(el => {\n      const target = parseInt(el.dataset.count, 10) || 0;\n      el.textContent = '0';\n      ScrollTrigger.create({\n        trigger: el, start: 'top 85%', once: true,\n        onEnter: () => {\n          const obj = { v: 0 };\n          gsap.to(obj, {\n            v: target, duration: 1.5, ease: 'power2.out',\n            onUpdate: () => { el.textContent = Math.round(obj.v); }\n          });\n        }\n      });\n    });\n\n    // ── E.2 — How It Works pinned (desktop only — mobile uses vertical stack) ──\n    const hiwPin = document.getElementById('hiw-pin');\n    let hiwST = null;\n    if (hiwPin && !touch && desktop){\n      hiwST = ScrollTrigger.create({\n        trigger: '#hiw-pin',\n        start: 'top top',\n        end: '+=260%',\n        pin: true,\n        scrub: 1,\n        invalidateOnRefresh: true,\n        snap: { snapTo: [0, 1/3, 2/3, 1], duration: { min: 0.18, max: 0.4 }, ease: 'power2.inOut' },\n        onUpdate: (self) => {\n          const p = self.progress;\n          let i = 0;\n          if (p >= .75) i = 3;\n          else if (p >= .5) i = 2;\n          else if (p >= .25) i = 1;\n          setHiwStep(i);\n        }\n      });\n\n      // (G.2 step clickability removed in H.1 — steps are passive scroll-driven labels)\n    }\n\n    // ── E.4 — Before/After morph (desktop only — mobile shows stacked) ──\n    const baBefore = document.getElementById('ba-before');\n    const baAfter  = document.getElementById('ba-after');\n    if (baBefore && baAfter && !touch && desktop){\n      gsap.set(baBefore, { rotation: 0, opacity: 1, scale: 1 });\n      gsap.set(baAfter,  { rotation: 10, opacity: 0, scale: .94 });\n      gsap.timeline({\n        scrollTrigger: {\n          trigger: '#ba-pin',\n          start: 'top top+=15%',\n          end: '+=160%',\n          pin: '.ba-stage',\n          scrub: true,\n          invalidateOnRefresh: true\n        }\n      })\n      .to(baBefore, { rotation: -10, opacity: 0, scale: .94, ease: 'power1.inOut' }, 0)\n      .to(baAfter,  { rotation: 0,   opacity: 1, scale: 1,   ease: 'power1.inOut' }, 0);\n    }\n\n    // ── E.5 — Magnetic CTAs (desktop, hover-capable, non-touch)\n    if (desktop && canHover && !touch){\n      document.querySelectorAll('.magnetic').forEach(el => {\n        const RADIUS = 110, MAX = 8;\n        let raf = 0, tx = 0, ty = 0, cx = 0, cy = 0;\n        const onMove = (e) => {\n          const r = el.getBoundingClientRect();\n          const ex = r.left + r.width/2, ey = r.top + r.height/2;\n          const dx = e.clientX - ex, dy = e.clientY - ey;\n          const dist = Math.hypot(dx, dy);\n          if (dist < RADIUS){\n            const f = 1 - dist / RADIUS;\n            tx = (dx / RADIUS) * MAX * f * 2;\n            ty = (dy / RADIUS) * MAX * f * 2;\n            tx = Math.max(-MAX, Math.min(MAX, tx));\n            ty = Math.max(-MAX, Math.min(MAX, ty));\n          } else { tx = 0; ty = 0; }\n          if (!raf) raf = requestAnimationFrame(loop);\n        };\n        const onLeave = () => { tx = 0; ty = 0; if (!raf) raf = requestAnimationFrame(loop); };\n        const loop = () => {\n          cx += (tx - cx) * .18; cy += (ty - cy) * .18;\n          el.style.transform = `translate(${cx.toFixed(2)}px, ${cy.toFixed(2)}px)`;\n          if (Math.abs(tx-cx) > .05 || Math.abs(ty-cy) > .05) raf = requestAnimationFrame(loop);\n          else { cx = tx; cy = ty; raf = 0; }\n        };\n        window.addEventListener('mousemove', onMove);\n        el.addEventListener('mouseleave', onLeave);\n      });\n    }\n\n    // ── E.7 — Stay Sereno letter split ──\n    const stay = document.getElementById('stay-sereno');\n    if (stay){\n      gsap.from('#stay-sereno .ch', {\n        y: 36, opacity: 0, duration: .65, stagger: .045, ease: 'power3.out',\n        scrollTrigger: { trigger: '.typo-moment', start: 'top 75%', once: true }\n      });\n      gsap.from('.typo-moment p', {\n        y: 22, opacity: 0, duration: .55, ease: 'power3.out', delay: .9,\n        scrollTrigger: { trigger: '.typo-moment', start: 'top 75%', once: true }\n      });\n    }\n\n    // ── Hero pointer parallax ──\n    if (desktop && canHover){\n      const compo = document.getElementById('compo');\n      if (compo){\n        const layers = compo.querySelectorAll('[data-depth]');\n        let raf = 0, tx = 0, ty = 0, cx = 0, cy = 0;\n        compo.addEventListener('mousemove', (e) => {\n          const r = compo.getBoundingClientRect();\n          tx = ((e.clientX - r.left) / r.width - .5) * 2;\n          ty = ((e.clientY - r.top) / r.height - .5) * 2;\n          if (!raf) raf = requestAnimationFrame(loop);\n        });\n        compo.addEventListener('mouseleave', () => { tx = 0; ty = 0; if (!raf) raf = requestAnimationFrame(loop); });\n        const loop = () => {\n          cx += (tx - cx) * .08; cy += (ty - cy) * .08;\n          layers.forEach(l => {\n            const d = parseFloat(l.dataset.depth) || 0;\n            const x = -cx * d, y = -cy * d;\n            if (l.classList.contains('phone-float')) l.style.transform = `translate(${x}px,${y}px) rotate(-4deg)`;\n            else l.style.transform = `translate(${x}px,${y}px)`;\n          });\n          if (Math.abs(tx - cx) > .002 || Math.abs(ty - cy) > .002) raf = requestAnimationFrame(loop);\n          else raf = 0;\n        };\n      }\n    }\n\n    // ── Scroll into view fix for anchor links (default smooth-scroll is already on; nothing extra needed)\n  });\n})();\n<\u002Fscript>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
